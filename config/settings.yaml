# ShortForge configuration (Phase 1).
# Every value here can also be overridden on the CLI. See `shortforge --help`.

paths:
  work_dir: .shortforge          # cache + intermediate files (per source hash)
  output_dir: out                # rendered clips land here

ingest:
  # yt-dlp format selector. Prefers <=1080p mp4, falls back to best.
  format: "bv*[height<=1080]+ba/b[height<=1080]/b"
  # Path to a cookies.txt for private/unlisted videos (M1 auth). Optional.
  cookies: null

transcribe:
  model: base                    # tiny | base | small | medium | large-v3
  device: auto                   # auto | cpu | cuda
  compute_type: auto             # auto | int8 | int8_float16 | float16 | float32
  language: null                 # null = autodetect; else ISO code e.g. "en"

detect:
  backend: auto                  # auto | llm | heuristic
  #   auto      -> use Claude if ANTHROPIC_API_KEY is set, else heuristic
  llm_model: claude-opus-4-8
  min_segment_score: 0.35        # candidates below this are dropped
  # M3++ visual hook signals (local, no API): score what's SHOWN, not just said.
  visual: true                   # fuse motion / scene-cut / face signals
  visual_weight: 0.35            # final = (1-w)*transcript + w*visual
  visual_sample_interval: 0.5    # seconds between sampled frames
  visual_cut_threshold: 0.25     # frame-diff level counted as a scene cut
  # Claude-vision multimodal scorer (claude-watch style; needs API key + vision):
  vision_llm: false              # sends contact sheets + transcript to Claude
  vision_hook_secs: 15
  vision_hook_fps: 6
  vision_body_interval: 3.5

select:
  target_duration: 45            # seconds (per Section 7 wizard)
  tolerance: 12                  # +/- seconds a clip may deviate from target
  num_clips: 0                   # 0 = use the tool's recommendation
  min_gap: 1.5                   # seconds required between selected clips
  # Each clip is one CONTINUOUS passage (never random splices). Coherent mode
  # snaps start/end to natural thought boundaries (pauses) so every short is a
  # complete idea (setup -> hook -> payoff), not an arbitrary window.
  coherent: true
  pause_threshold: 0.5           # gap (s) that marks a thought/topic boundary

reframe:
  aspect: "9:16"                 # 9:16 | 1:1 | 16:9 | WxH (e.g. 1080x1920)
  width: 1080
  height: 1920
  fill: crop                     # crop (center smart-crop) | blur (fit + blurred bg)
  mode: track                    # track (follow speaker, M5) | center
  track_sample_interval: 0.33    # seconds between face-detection samples
  track_smooth_window: 5         # moving-average window for the pan path
  face_score: 0.6                # YuNet detection confidence threshold

captions:
  enabled: true
  # Named template = consistent look across every clip on a page (M7).
  template: clean                # clean | bold_pop | karaoke_amber | reveal_green | boxed | minimal
  animation: null                # null = template default; none | fade | pop | karaoke | reveal
  style: null                    # legacy shorthand: karaoke | simple (maps to animation)
  # Any of these override the chosen template when set (null = use template):
  font: null                     # text form, e.g. "DejaVu Sans" / "DejaVu Serif" / "FreeSans"
  font_size: null
  uppercase: null
  primary_color: null            # ASS &HAABBGGRR, opaque white = &H00FFFFFF
  highlight_color: null          # sung word colour
  outline_color: null
  outline: null
  shadow: null
  # Safe margin from the bottom edge (px at output resolution) so captions
  # clear the platform action bar / right-side buttons.
  bottom_margin: null
  # Line grouping (behaviour, not look):
  max_line_chars: 30
  max_line_duration: 2.5         # seconds per caption line

edit:                            # M9 jump cuts — trim dead air (off by default)
  # Wired into the render: video + audio are cut and captions remapped together
  # so nothing desyncs. Automatically skipped when dubbing (a new voice would
  # not line up). Turn on with --jumpcuts.
  jumpcuts: false
  min_silence: 0.8               # gaps longer than this are trimmed
  max_gap: 0.35                  # kept breathing room after trimming
  pad: 0.1                       # seconds of speech kept on each side of a run

brand:                           # M8 logo overlay
  logo: null                     # path to a PNG/logo image
  corner: TR                     # TL | TR | BL | BR
  size: 0.18                     # fraction of output width (<=1) or px (>1)
  opacity: 0.85
  margin: 40

metadata:                        # M10 titles/description/hashtags
  enabled: true
  backend: auto                  # auto | llm | heuristic

publish:                         # M14 per-video publishing sidecar
  # Writes a copy-paste-ready <video>.txt with the Title / Description / Tags
  # next to each clip, so they travel with the video (not just in the manifest).
  sidecar: true

thumbnail:                       # M11 cover image
  enabled: true
  text_hook: false               # draw the title on the cover

page:                            # Section 8 per-page profile (optional)
  niche: null
  tone: null
  hashtags: []

localize:                        # M6 localization (Phase 3)
  language: null                 # target lang code (en/de/it/es/ja/ar); null = keep source
  dub: false                     # synthesize a voiceover (else captions-only in target lang)
  tts_backend: auto              # auto | espeak (offline) | edge (natural) | xtts (clone, GPU)
  espeak_speed: 165
  edge_voice: null               # override the Edge neural voice
  voice_sample: null             # reference clip of your voice for xtts cloning
  translate_backend: auto        # auto | llm (Claude) | argos (offline)
  allow_untranslated: false      # A2: proceed even if translation fails (loud warning)
  # A1 — remove the ORIGINAL voice, keep music/SFX. Dubbing splits the source
  # into vocals + accompaniment (Demucs), drops vocals, and ducks the
  # accompaniment under the new voice. Without Demucs the run ABORTS (it will not
  # play two voices) unless allow_voice_bleed is set.
  stem_separation: auto          # auto | true | false
  stem_model: htdemucs           # Demucs model; lighter/faster CPU option: mdx_extra_q
  demucs_model: htdemucs         # back-compat alias
  accompaniment_gain_db: 0.0     # music/SFX bed level
  duck_db: -6.0                  # how far the bed dips under the dub voice
  duck_attack_ms: 5
  duck_release_ms: 250
  allow_voice_bleed: false       # allow ducking the ORIGINAL instead (two voices)
  bleed_duck_db: -12.0           # duck depth for the allow_voice_bleed path

lipsync:                         # Optional Wav2Lip lip-sync — CROSS-LANGUAGE dubs only.
  # When you dub into another language the on-screen lips no longer match the
  # new voice. Wav2Lip re-renders the mouth so the lips track the dub. Same-
  # language clips keep the original audio + real lips, so this never runs on
  # them. Needs a GPU + a cloned Wav2Lip; missing/failed = original render kept.
  enabled: false
  backend: auto                  # auto | wav2lip
  wav2lip_repo: null             # path to cloned github.com/Rudrabha/Wav2Lip (has inference.py)
  checkpoint: null               # path to wav2lip_gan.pth
  python: null                   # interpreter for Wav2Lip's venv (null = current)
  pads: "0 10 0 0"               # face padding: top bottom left right
  resize_factor: 1               # downscale before inference for speed
  nosmooth: false                # disable temporal mouth smoothing

cache:                           # A2 cache controls (also --no-cache / --refresh-translation)
  disabled: false                # never read or write caches
  refresh_translation: false     # recompute translation only, keep transcript/analysis

review:                          # M12 QC review gate
  enabled: true

render:
  crf: 20                        # H.264 quality (lower = better)
  preset: veryfast
  audio_bitrate: 128k
  fps: null                      # null = keep source fps
  loudnorm: true                 # M9: normalize to ~-14 LUFS (social standard)
  loudnorm_i: -14.0
  loudnorm_tp: -1.5
  loudnorm_lra: 11.0
