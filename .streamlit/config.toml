# ShortForge dashboard config.
# headless = true keeps first launch fully unattended: no "Welcome / Email:"
# prompt (which would block the hidden .vbs launcher) and no double browser tab.
# The launchers (start_ui.bat / start_ui.vbs) open the browser themselves.
[browser]
gatherUsageStats = false

[server]
headless = true
port = 8501

# Soft, minimal palette. Muted slate-blue accent rather than Streamlit's default
# red, warm off-white ground instead of pure #FFF (less glare on a screen that
# is watched for hours), and low-contrast surfaces so panels separate by tone
# rather than by hard borders.

# Branded palette: a rich indigo→violet accent against clean near-white
# surfaces and near-black text. Minimal in the sense of "few elements, lots of
# breathing room" — NOT desaturated. The first pass read minimal as grey and
# came out lifeless; colour carries the brand, restraint comes from how little
# of it is used.
[theme]
base = "light"
primaryColor = "#6366F1"
backgroundColor = "#FAFAFB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
font = "sans serif"
